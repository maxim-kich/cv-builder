services:
  cv-builder:
    build:
      context: .
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      CV_BUILDER_API_TOKEN: "${CV_BUILDER_API_TOKEN:?Set a long random access token in Coolify}"
      CV_BUILDER_PUBLIC_URL: "${CV_BUILDER_PUBLIC_URL:?Set the public HTTPS URL in Coolify}"
      # OAuth is optional during a staged rollout so an automatic Coolify deploy
      # preserves existing browser/static-token access before Auth0 is configured.
      # Set issuer, audience, JWKS URL, and allowed subject together to enable it.
      CV_BUILDER_OAUTH_ISSUER: "${CV_BUILDER_OAUTH_ISSUER:-}"
      CV_BUILDER_OAUTH_AUDIENCE: "${CV_BUILDER_OAUTH_AUDIENCE:-}"
      CV_BUILDER_OAUTH_JWKS_URL: "${CV_BUILDER_OAUTH_JWKS_URL:-}"
      CV_BUILDER_OAUTH_ALLOWED_SUBJECTS: "${CV_BUILDER_OAUTH_ALLOWED_SUBJECTS:-}"
      CV_BUILDER_OAUTH_ALGORITHMS: "${CV_BUILDER_OAUTH_ALGORITHMS:-RS256}"
      CV_BUILDER_OAUTH_MAX_TOKEN_LIFETIME_SECONDS: "${CV_BUILDER_OAUTH_MAX_TOKEN_LIFETIME_SECONDS:-600}"
      CV_BUILDER_OAUTH_REVOKED_TOKEN_IDS: "${CV_BUILDER_OAUTH_REVOKED_TOKEN_IDS:-}"
      CV_BUILDER_OAUTH_REVOKED_BEFORE: "${CV_BUILDER_OAUTH_REVOKED_BEFORE:-}"
      CV_BUILDER_OAUTH_INTROSPECTION_URL: "${CV_BUILDER_OAUTH_INTROSPECTION_URL:-}"
      CV_BUILDER_OAUTH_INTROSPECTION_CLIENT_ID: "${CV_BUILDER_OAUTH_INTROSPECTION_CLIENT_ID:-}"
      CV_BUILDER_OAUTH_INTROSPECTION_CLIENT_SECRET: "${CV_BUILDER_OAUTH_INTROSPECTION_CLIENT_SECRET:-}"
      CV_BUILDER_SEED_FILE: "none"
      DATABASE_URL: "postgresql://cv_builder:${POSTGRES_PASSWORD:?Set a long random database password in Coolify}@postgres:5432/cv_builder"
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 512m
    mem_reservation: 192m
    cpus: 1.0

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cv_builder
      POSTGRES_USER: cv_builder
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set a long random database password in Coolify}"
    volumes:
      - cv_builder_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cv_builder -d cv_builder"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 1g
    mem_reservation: 256m
    cpus: 0.75

volumes:
  cv_builder_postgres:
